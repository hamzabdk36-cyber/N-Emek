# N-Emek surekli tumlestirme
#
# Iki bagimsiz is: backend (pytest) ve arayuz (tip denetimi + testler +
# derleme). Ayri tutuluyorlar ki biri kirildiginda digerinin sonucu yine
# gorulsun - "her sey kirmizi" tek bir hatayi gizliyor.
#
# Yesil rozet gercekten bir sey soylemeli
# ---------------------------------------
# Ilk surumde backend isi korpussuz kosuyordu ve yesil yaniyordu:
# `test_api_ucnoktalari` ile `test_e2e_altin_senaryo` modul
# fikstürlerinden atlaniyor, geriye yalnizca 22 saf pay testi kaliyordu.
# 47 test sessizce atlanmis, is yine basarili gorunmustu.  # sayim: tarihsel
# Iki karsi
# onlem var: korpus CI'da indiriliyor (asagida) ve `tests/conftest.py`
# korpus yokken CI'da atlamak yerine duruyor.
#
# `slow` isaretli iki test yine kosmuyor; onlar koken kurtarma hattini
# tam korpusla olcuyor ve yerelde kosuluyor.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Ayni dala arka arkaya gonderim yapilinca onceki kosu iptal olsun.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    env:
      # Kosucuda GPU yok; yine de acikca yaziliyor ki bir gun GPU'lu
      # kosucuya gecilirse test ortami sessizce degismesin.
      NEMEK_FORCE_CPU: "1"
      # CLIP agirliklari buraya iniyor; adim adim onbellege aliniyor.
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # CLIP ViT-B/32 agirliklari ~600 MB. Altin senaryo testi koken
      # kurtarma hattinin tamamini calistirdigi icin modele ihtiyac var;
      # onbellek olmadan her kosu bastan indirir.
      - name: CLIP model önbelleği
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: clip-vit-b-32-laion2b-v1

      # `opencv-contrib-python` (headless olmayan surum) libGL ve libglib
      # istiyor. Bagimliligi degistirmek yerine kosucuya bu iki
      # kutuphaneyi koyuyoruz ki yerel kurulumla ayni paket kalsin -
      # backend/Dockerfile de ayni sey yapiyor.
      - name: OpenCV'nin paylaşılan kütüphaneleri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # SIRA ONEMLI: torch once ve CPU indeksinden.
      #
      # Ters sirada calismiyor: `requirements.txt` icindeki
      # `open_clip_torch`, torch'u bagimlilik olarak cekiyor ve pip bunu
      # varsayilan PyPI'den, yani CUDA'li halinden aliyor. Arkasindan
      # gelen CPU komutu "zaten kurulu" deyip geciyor ve kurulum ~750 MB
      # nvidia_* paketiyle sisiyor.
      - name: Bağımlılıklar (torch önce, CPU indeksinden)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      # Sertifikalar depoda degil; her ortamda yeniden uretiliyor.
      # Uretilmezse c2pa imzalama sessizce devre disi kalir ve testler
      # gercek imzalama yolunu hic gecmez.
      - name: C2PA geliştirme sertifikaları
        run: python scripts/gen_dev_certs.py

      # Testler korpustan yalnizca photos[0] ve photos[3]'u kullaniyor,
      # yani sekiz gorsel yetiyor. Tam korpus (320) degerlendirme
      # betikleri icin ve yerelde kaliyor.
      - name: Test korpusu (8 görsel)
        run: python scripts/fetch_eval_images.py 8

      - name: Testler (122 test)  # sayim: backend-hizli
        working-directory: backend
        # -rs: atlanan varsa sebebi gunluge yazilsin. Atlama artik
        # CI'da hata, ama baska bir sebeple atlama cikarsa gorulsun.
        run: python -m pytest -m "not slow" -rs

      # Dokumanlardaki "N test" / "N uc" iddialarini olcumle karsilastirir.
      # Bu sayilar bir gelistirme oturumunda dort kez eskidi; her seferinde
      # elle duzeltildi ve kaymayi yakalayan bir sey yoktu.
      #
      # `--atla arayuz`: bu iste node yok. Arayuz sayisi, node'u olan
      # arayuz isinde denetleniyor - yani iki is birlikte her sayiyi
      # kapsiyor ve hicbiri sessizce atlanmiyor.
      - name: Doküman denetimi
        run: python scripts/dokuman_denetimi.py --atla arayuz

  frontend:
    name: Arayüz — tip denetimi, testler, derleme
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      # `npm run build` zaten `tsc -b` calistiriyor, ama ayri adim olarak
      # da duruyor: kirilan sey tip mi yoksa paketleme mi, kosu
      # gunlugunde tek bakista gorulsun.
      - name: Tip denetimi
        run: npx tsc --noEmit

      - name: Testler (95 test)  # sayim: arayuz
        run: npx vitest run

      - name: Derleme
        run: npm run build

      # Backend isinin karsi yarisi: orada `--atla arayuz`, burada
      # `--atla backend`. Bu iste backend bagimliliklari (torch, faiss)
      # kurulu degil; arayuz sayisini olcmek icin de gerekmiyorlar.
      # Bu isin varsayilan calisma dizini `frontend`; betik depo kokunden
      # kosmali.
      - name: Doküman denetimi (arayüz sayıları)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/dokuman_denetimi.py --atla backend
