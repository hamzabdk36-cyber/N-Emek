server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router istemci tarafinda calisiyor: /icerik/<id> gibi
    # adresler sunucuda dosya olarak yok. Bulunamayan her yol index.html'e
    # duser, yonlendirmeyi uygulama yapar. Bu satir olmadan sayfayi
    # yenilemek veya link paylasmak 404 verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gelistirmede Vite'in vekilledigi yolu burada nginx vekilliyor;
    # arayuz kodunda mutlak URL tutulmuyor, iki ortamda da /api calisiyor.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gorsel yukleme: varsayilan 1 MB sinirini asan dosyalar var.
        client_max_body_size 32m;
        # Koken kurtarma hatti bir yuklemede ~700 ms, ilk cagride CLIP
        # modeli inerken cok daha uzun surebilir.
        proxy_read_timeout 600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
